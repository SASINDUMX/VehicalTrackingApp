name: Keep Supabase Alive

on:
  schedule:
    # Runs at 12:00 UTC on Monday and Thursday (every 3-4 days to stay well within the 7-day window)
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY secret is missing! Please configure them in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          echo "Pinging Supabase database to refresh activity timestamp..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/workplaces?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "Response HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Success! Database query executed successfully. Supabase inactivity timer has been reset."
          else
            echo "::error::Unexpected status code: $HTTP_STATUS"
            exit 1
          fi
